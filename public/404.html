<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
        (function () {
            const path = window.location.pathname;

            const isFileRequest =
                path.includes(".") &&
                !path.endsWith(".html");

            if (isFileRequest) {
                return;
            }

            sessionStorage.redirect = window.location.href;
            window.location.replace(
                window.location.origin + "/"
            );
        })();
    </script>
</head>

<body>
    Page not found.
</body>

</html>
