name: Build App

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-new
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci
      
      - name: Run generate
        run: |
          npm run generate
      
      - name: Check generated files
        run: |
          if ! git diff --exit-code -- .; then
            echo "The site had changes after generation!"
            git diff
            exit 1
          fi

          echo "The generated site is up to date"
      
  test-build:
    runs-on: ubuntu-latest
    needs: 
      - test-generate
    defaults:
      run:
        working-directory: site-new
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci
      
      - name: Test build
        run: npm run build
    