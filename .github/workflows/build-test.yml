name: Build App

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-new
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Hash site and write to file
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1 > ../hash.txt
          echo "Hash: $(cat hash.txt)"
      
      - name: Run generate
        run: |
          npm run generate
      
      - name: Hash site again and compare
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1 > ../hash_two.txt
          echo "The pre generated hash is: $(cat hash.txt)"
          echo "The post generated hash is: $(cat hash_two.txt)"

          if cmp -s hash.txt hash_two.txt; then
            echo "The site hashes match"
          else
            echo "The hashes are different! The site had not been properly generated"
            exit 1
          fi
      
  test-build:
    runs-on: ubuntu-latest
    needs: 
      - test-generate
    defaults:
      run:
        working-directory: site-new
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci
      
      - name: Test build
        run: npm run build
    